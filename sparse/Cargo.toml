[package]
name = "sparse"
version = "0.1.0"
edition = "2024"

[dependencies]
thiserror = "2.0.16"
rayon     = { version = "1.10", optional = true }
matrix-market-rs = { version = "0.1", optional = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3"

[features]
default  = []
parallel = ["dep:rayon"]
io       = ["dep:matrix-market-rs"]

[[bench]]
name    = "matvec"
harness = false

[[bench]]
name    = "assembly"
harness = false